name: Check MACH_XIAOMI

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Kernel repo URL"
        default: "https://github.com/GhaintBadhan/Agni-Source"
      branch:
        description: "Branch"
        default: "main"

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Clone kernel
        run: |
          git clone --depth 1 -b "${{ inputs.branch }}" "${{ inputs.repo }}" kernel

      - name: Search Kconfig files
        run: |
          cd kernel
          echo "=== Kconfig definitions of MACH_XIAOMI ==="
          grep -rn "MACH_XIAOMI" --include='Kconfig*' . | head -40 || true

      - name: Search whole tree
        run: |
          cd kernel
          echo "=== Any CONFIG_MACH_XIAOMI reference ==="
          grep -rn "CONFIG_MACH_XIAOMI" . 2>/dev/null | head -40 || true

      - name: Search defconfigs
        run: |
          cd kernel
          echo "=== In arch/arm64/configs ==="
          grep -n "MACH_XIAOMI" arch/arm64/configs/*vili* 2>/dev/null | head -40 || true
          echo "=== Config files present ==="
          ls arch/arm64/configs | grep -i -E "vili|agni|xiaomi" || true
