name: Import kernel source from release asset

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag that holds the zip
        required: true
        default: Source-import
      asset:
        description: Zip file name attached to that release
        required: true
        default: Kernel.zip

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TAG: ${{ inputs.tag }}
      ASSET: ${{ inputs.asset }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download zip from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" -p "$ASSET" -D /tmp -R "$GITHUB_REPOSITORY"
          ls -lh "/tmp/$ASSET"

      - name: Extract and replace tree
        run: |
          mkdir -p /tmp/src
          unzip -q "/tmp/$ASSET" -d /tmp/src
          ROOT=$(find /tmp/src -maxdepth 2 -type d -name arch -printf '%h\n' | head -1)
          echo "Source root: $ROOT"
          test -f "$ROOT/Makefile"
          test -f "$ROOT/Kconfig"
          test -d "$ROOT/arch/arm64"
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a "$ROOT"/. .
          echo "Files copied: $(find . -path ./.git -prune -o -type f -print | wc -l)"


      - name: Commit and push
        run: |
          git config user.name "GhaintBadhan"
          git config user.email "ghaint.badhan@gmail.com"
          git add -A
          git commit -m "Import clean kernel source from $TAG" || echo "No changes to commit"
          git push

